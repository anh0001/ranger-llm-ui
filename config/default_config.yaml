# Ranger LLM UI Configuration
# This file contains default configuration for the Ranger LLM UI.

# LLM Configuration
llm:
  # Provider: openai, ollama, anthropic, or claude_code
  provider: openai

  # Model name (leave empty for provider default)
  # Examples:
  #   OpenAI: gpt-4o-mini, gpt-4o, gpt-4.1-mini
  #   Ollama: llama2, codellama, mistral
  #   Anthropic: claude-3-sonnet-20240229
  #   Claude Code (subscription via OAuth): opus, sonnet, haiku
  model: ""

  # Temperature for LLM generation (0.0 = deterministic, 1.0 = creative)
  temperature: 0.0

# Gradio UI Configuration
ui:
  # Server port
  port: 7860

  # Create public share link
  share: false

  # Theme (soft, default, glass, monochrome)
  theme: soft

# Safety Configuration
safety:
  # Maximum linear velocity (m/s)
  max_linear_velocity: 0.5

  # Default linear velocity (m/s)
  default_linear_velocity: 0.2

  # Maximum angular velocity (rad/s)
  max_angular_velocity: 1.0

  # Maximum single move distance (m)
  max_single_move_distance: 5.0

  # Distance threshold requiring confirmation (m)
  confirmation_threshold_distance: 2.0

  # Low battery warning threshold (%)
  low_battery_threshold: 20.0

  # Critical battery threshold (%)
  critical_battery_threshold: 10.0

# ROS 2 Configuration
ros:
  # Node name
  node_name: ranger_llm_ui

  # Topics
  topics:
    cmd_vel: /cmd_vel
    odom: /odom
    battery_state: /battery_state

  # Action servers for closed-loop movement control
  actions:
    drive_distance: /drive_distance
    rotate_angle: /rotate_angle

  # Action server control loop rate (Hz)
  action_control_rate: 20.0

  # Distance tolerance for drive goal completion (meters)
  distance_tolerance: 0.05

  # Angle tolerance for rotate goal completion (degrees)
  angle_tolerance: 1.0

  # Timeout waiting for action server to become available (seconds)
  action_server_timeout: 5.0

# Manipulation Configuration
# Arm skills are executed by the companion MobileManipulationCore stack over a
# single generic ROS 2 action (manipulation_msgs/action/ExecuteSkill). Requires
# that stack's manipulation_msgs to be built+sourced and its skill_server
# running (ros2 launch manipulation_bringup core_launch.py).
# Repo: https://github.com/anh0001/MobileManipulationCore
manipulation:
  # Enable the manipulation skill tools (Pick, Place, PickAndPlace, HomeArm,
  # Handover). Set false on a base-only robot with no arm.
  # Env override: ENABLE_MANIPULATION_TOOLS
  enabled: true

  # Action name the skill server advertises (env override: EXECUTE_SKILL_ACTION)
  execute_skill_action: /execute_skill

  # Default client-side ceiling (seconds) to wait for a skill result when the
  # caller gives no per-skill timeout (env override: SKILL_GOAL_TIMEOUT_S).
  # Manipulation skills are slow (detect -> align -> grasp -> lift).
  skill_goal_timeout: 300.0

# Camera Configuration
camera:
  # Image resolution for LLM consumption (reduced defaults for token efficiency)
  max_width: 320
  max_height: 240

  # JPEG compression quality (10-100, higher = better quality but more tokens)
  # Recommended: 70-80 for good balance
  quality: 75

  # Image format: "jpeg" (smaller, lossy) or "png" (larger, lossless)
  # JPEG is strongly recommended to reduce token usage by 85-92%
  format: jpeg

  # Default camera topic
  topic: /camera/image_raw

# Logging Configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO

  # Log to console
  console: true

  # Log to file
  file: true

  # Log directory (relative to home)
  log_dir: .ranger_llm_ui/logs
