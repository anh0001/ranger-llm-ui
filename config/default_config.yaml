# Ranger LLM UI Configuration
# This file contains default configuration for the Ranger LLM UI.

# LLM Configuration
llm:
  # Provider: openai, ollama, anthropic, or claude_code
  provider: openai

  # Model name (leave empty for provider default)
  # Examples:
  #   OpenAI: gpt-4o-mini, gpt-4o, gpt-4.1-mini
  #   Ollama: llama2, codellama, mistral
  #   Anthropic: claude-3-sonnet-20240229
  #   Claude Code (subscription via OAuth): opus, sonnet, haiku
  model: ""

  # Temperature for LLM generation (0.0 = deterministic, 1.0 = creative)
  temperature: 0.0

# Gradio UI Configuration
ui:
  # Server port
  port: 7860

  # Create public share link
  share: false

  # Theme (soft, default, glass, monochrome)
  theme: soft

# Safety Configuration
safety:
  # Maximum linear velocity (m/s)
  max_linear_velocity: 0.5

  # Default linear velocity (m/s)
  default_linear_velocity: 0.2

  # Maximum angular velocity (rad/s)
  max_angular_velocity: 1.0

  # Maximum single move distance (m)
  max_single_move_distance: 5.0

  # Distance threshold requiring confirmation (m)
  confirmation_threshold_distance: 2.0

  # Low battery warning threshold (%)
  low_battery_threshold: 20.0

  # Critical battery threshold (%)
  critical_battery_threshold: 10.0

# ROS 2 Configuration
ros:
  # Node name
  node_name: ranger_llm_ui

  # Topics
  topics:
    cmd_vel: /cmd_vel
    odom: /odom
    battery_state: /battery_state

  # Custom dead-reckoning action servers for RELATIVE moves in robot-body frame
  # (MoveForward/MoveBackward/TurnAngle). Closed-loop odometry control, no
  # obstacle avoidance. Hosted by movement_action_server.py.
  actions:
    drive_distance: /drive_distance
    rotate_angle: /rotate_angle

  # Action server control loop rate (Hz)
  action_control_rate: 20.0

  # Distance tolerance for drive goal completion (meters)
  distance_tolerance: 0.05

  # Angle tolerance for rotate goal completion (degrees)
  angle_tolerance: 1.0

  # Timeout waiting for action server to become available (seconds)
  action_server_timeout: 5.0

  # Nav2 "2D Nav Goal" autonomous navigation (the NavigateToPose tool). Drives
  # to an ABSOLUTE pose with obstacle-aware global + local planning — the same
  # path Nav2 takes for RViz's "2D Nav Goal". Requires the Nav2 stack running
  # (robofi_bringup navigation) and nav2_msgs sourced. Relative moves use the
  # dead-reckoning actions above instead.
  navigation:
    # Nav2 NavigateToPose action server name (env: NAV2_NAVIGATE_ACTION)
    navigate_action: navigate_to_pose
    # Frame the goal pose (x, y, yaw) is expressed in (env: NAV2_GOAL_FRAME).
    # 'map' is the Nav2 global frame.
    goal_frame: map
    # Max client-side wait for Nav2 to reach the goal, seconds. Nav2 plans
    # around obstacles, so journeys can be long (env: NAV2_GOAL_TIMEOUT_S).
    goal_timeout: 300.0

# Manipulation Configuration
# Arm skills are executed by the companion MobileManipulationCore stack over a
# single generic ROS 2 action (manipulation_msgs/action/ExecuteSkill). Requires
# that stack's manipulation_msgs to be built+sourced and its skill_server
# running (ros2 launch manipulation_bringup core_launch.py).
# Repo: https://github.com/anh0001/MobileManipulationCore
manipulation:
  # Enable the manipulation skill tools (Pick, Place, PickAndPlace, HomeArm,
  # ReadyArm, Handover). Set false on a base-only robot with no arm.
  # Env override: ENABLE_MANIPULATION_TOOLS
  enabled: true

  # Action name the skill server advertises (env override: EXECUTE_SKILL_ACTION)
  execute_skill_action: /execute_skill

  # Default client-side ceiling (seconds) to wait for a skill result when the
  # caller gives no per-skill timeout (env override: SKILL_GOAL_TIMEOUT_S).
  # Manipulation skills are slow (detect -> align -> grasp -> lift).
  skill_goal_timeout: 300.0

# Camera Configuration
camera:
  # Image resolution for LLM consumption (reduced defaults for token efficiency)
  max_width: 320
  max_height: 240

  # JPEG compression quality (10-100, higher = better quality but more tokens)
  # Recommended: 70-80 for good balance
  quality: 75

  # Image format: "jpeg" (smaller, lossy) or "png" (larger, lossless)
  # JPEG is strongly recommended to reduce token usage by 85-92%
  format: jpeg

  # Default camera topic (the 'front' camera). Env: CAMERA_TOPIC
  topic: /camera/image_raw

  # Named cameras the agent selects with GetCameraImage(camera="..."):
  #   front - forward/base Tier IV C2-176 fisheye (ROS topic above).
  #           Env: CAMERA_TOPIC
  #   wrist - Intel RealSense D405 on the arm wrist (ROS topic).
  #           Env: CAMERA_WRIST_TOPIC
  #           default: /piper/wrist_camera/piper_d405/color/image_raw
  #   rear  - Intel RealSense D435i mounted BEHIND the arm. NOT a ROS stream:
  #           grabbed on demand by serial with pyrealsense2 (like the MMC
  #           handover skill), then released. pyrealsense2 is an optional,
  #           hardware-only dependency; if it/the device is missing the tool
  #           fails gracefully. Envs: CAMERA_REAR_SERIAL (default 243722070013),
  #           CAMERA_REAR_WIDTH/HEIGHT/FPS, CAMERA_REAR_WARMUP_FRAMES,
  #           CAMERA_REAR_TIMEOUT_SEC, and CAMERA_REALSENSE_EXTRA_SITE (point at
  #           a user site-packages dir if pyrealsense2 isn't importable under the
  #           ROS env's PYTHONNOUSERSITE).
  # Override the default view with CAMERA_DEFAULT (front|wrist|rear).

  # Describe the captured frame in the chat (instead of a plain caption). Because
  # GetCameraImage renders the image directly to the UI (return_direct), the
  # agent never "sees" it; so the tool makes ONE short vision call on the
  # downscaled frame using the agent's configured LLM and uses the result as the
  # caption above the image. Disable to skip that call (a plain caption is used).
  #   CAMERA_DESCRIBE        - true|false (default true)
  #   CAMERA_DESCRIBE_PROMPT - instruction for the description ({camera} is filled
  #                            in); first-person default ("I can see ...").
  # Needs a vision-capable provider/model (OpenAI gpt-4o, Anthropic Claude, etc.);
  # falls back to a plain caption (image still shown) if vision is unavailable.

# Logging Configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO

  # Log to console
  console: true

  # Log to file
  file: true

  # Log directory (relative to home)
  log_dir: .ranger_llm_ui/logs
